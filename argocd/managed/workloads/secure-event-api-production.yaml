# Production is still auto-synced with selfHeal so drift is repaired automatically.
# The manual approval gate is the Git merge: environments/production/** needs a CODEOWNERS
# review, and the promote workflow runs in the approval-protected "production" environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-event-api-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: secure-event-api
  source:
    repoURL: https://github.com/momenckhouse-dev/gitops-config.git
    targetRevision: main
    path: environments/production
  destination:
    server: https://kubernetes.default.svc
    namespace: secure-event-api-production
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

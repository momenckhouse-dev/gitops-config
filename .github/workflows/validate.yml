name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.6.7
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  ops-tooling:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pytest~=8.3" "ruff~=0.8" "pyyaml~=6.0"
      - name: Lint Python (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: platform-doctor tests
        run: pytest -q

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML
        run: yamllint -c .yamllint .

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.5.0

      - name: Lint Helm chart
        run: helm lint --strict charts/secure-event-api

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render and schema-validate every environment
        run: |
          mkdir -p rendered
          for env in staging production; do
            kustomize build --enable-helm "environments/${env}" > "rendered/${env}.yaml"
            kubeconform -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default -schema-location "${CRD_SCHEMAS}" \
              -skip SecureService \
              "rendered/${env}.yaml"
          done
          kustomize build platform/monitoring/config > rendered/monitoring.yaml
          kubeconform -strict -summary -schema-location default -schema-location "${CRD_SCHEMAS}" rendered/monitoring.yaml

      - name: Kubernetes misconfiguration scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Show the diff a reviewer is approving
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          for env in staging production; do
            kustomize build --enable-helm "/tmp/base/environments/${env}" > "/tmp/${env}-base.yaml" || true
            echo "### ${env}" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            diff -u "/tmp/${env}-base.yaml" "rendered/${env}.yaml" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

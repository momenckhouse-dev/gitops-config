name: promote-to-production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote (blank = whatever staging runs now)"
        required: false
        type: string

# The PR is pushed with the GitHub App bot's token: PRs opened with GITHUB_TOKEN do not trigger the
# required validate/ops-tooling checks, so they could never merge.
permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    # Required reviewers on this environment = approval #1 (may this release be proposed?).
    # The bot-authored PR is merged by hand = approval #2 (the exact diff). With more than one
    # maintainer, also require a CODEOWNERS review on main so #2 is enforced, not just practised.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2

      - name: Resolve image from staging
        id: img
        run: |
          NAME=$(yq '.images[] | select(.name == "secure-event-api") | .newName' environments/staging/kustomization.yaml)
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(yq '.images[] | select(.name == "secure-event-api") | .newTag' environments/staging/kustomization.yaml)
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Pin image in production overlay
        working-directory: environments/production
        run: kustomize edit set image "secure-event-api=${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}"

      - name: Mint short-lived bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GITOPS_BOT_APP_ID }}
          private-key: ${{ secrets.GITOPS_BOT_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: promote/production-${{ steps.img.outputs.tag }}
          commit-message: "production: promote secure-event-api ${{ steps.img.outputs.tag }}"
          title: "production: promote secure-event-api ${{ steps.img.outputs.tag }}"
          labels: release, production
          body: |
            Promotes `${{ steps.img.outputs.tag }}` (currently healthy in staging) to production.

            Requested by @${{ github.actor }} and approved through the `production` environment gate.
            Review the diff (only the image tag should change), then merge by hand: no auto-merge for production.
            After merge Argo CD syncs `secure-event-api-production` automatically.
            Rollback = `git revert` of this PR's merge commit.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - prometheusrules-platform.yaml
  - prometheusrules-secure-event-api.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Platform

configMapGenerator:
  - name: dashboard-platform-overview
    files:
      - dashboards/platform-overview.json

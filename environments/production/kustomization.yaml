apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: secure-event-api-production

resources:
  - namespace.yaml
  - ../base

labels:
  - pairs:
      environment: production
    includeSelectors: false

images:
  - name: secure-event-api
    newName: 111122223333.dkr.ecr.eu-west-1.amazonaws.com/secure-event-api
    newTag: 3f9c2a1b7d4e

patches:
  - path: patches/serviceaccount.yaml
  - path: patches/secureservice.yaml
  - path: patches/deployment-resources.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: secure-event-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: PodDisruptionBudget
      name: secure-event-api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2

{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "secure-event-api.fullname" . }}
  labels:
    {{- include "secure-event-api.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "secure-event-api.selectorLabels" . | nindent 6 }}
{{- end }}

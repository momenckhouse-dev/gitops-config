[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
known-first-party = ["platform_doctor"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["platform-doctor"]
testpaths = ["platform-doctor"]
